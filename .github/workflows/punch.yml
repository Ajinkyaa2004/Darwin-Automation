name: Darwinbox punch

on:
  schedule:
    # Times are UTC. IST = UTC + 5:30. Days: Sat, Sun, Mon, Tue, Wed.
    # Several tries each, because GitHub often delays or drops scheduled runs.
    # Extra tries are harmless: the script never punches twice.
    - cron: "5 8 * * 6,0,1,2,3"    # clock in  ~1:35 PM IST
    - cron: "35 8 * * 6,0,1,2,3"   # clock in  retry ~2:05 PM
    - cron: "17 9 * * 6,0,1,2,3"   # clock in  retry ~2:47 PM
    - cron: "25 17 * * 6,0,1,2,3"  # clock out ~10:55 PM IST
    - cron: "47 17 * * 6,0,1,2,3"  # clock out retry ~11:17 PM
    - cron: "7 18 * * 6,0,1,2,3"   # clock out retry ~11:37 PM
  workflow_dispatch:
    inputs:
      action:
        description: "in or out"
        required: true
        default: "in"
        type: choice
        options: [in, out]
      dry_run:
        description: "Dry run (log in and check, never click)"
        type: boolean
        default: true

concurrency:
  group: darwinbox-punch
  cancel-in-progress: false

jobs:
  punch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Restore saved session
        uses: actions/cache/restore@v4
        with:
          path: state/
          key: dbx-state-${{ github.run_id }}
          restore-keys: dbx-state-
      - name: Punch
        env:
          DARWINBOX_USER: "13431"
          DARWINBOX_PASS: ${{ secrets.DARWINBOX_PASS }}
          DARWINBOX_STATE: ${{ secrets.DARWINBOX_STATE }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          # Manual runs use the checkbox. Scheduled runs stay dry until the
          # repo variable LIVE is set to "1".
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && (inputs.dry_run && '1' || '0') || (vars.LIVE == '1' && '0' || '1') }}
          # Manual dry runs ignore the day/time guards (they never click).
          FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '1' || '0' }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ACTION="${{ inputs.action }}"
          else
            # Hour field of the cron that fired: 8-9 UTC = in, 17-18 UTC = out.
            HOUR=$(echo "${{ github.event.schedule }}" | awk '{print $2}')
            if [ "$HOUR" -lt 12 ]; then ACTION=in; else ACTION=out; fi
          fi
          node punch.js "$ACTION"
      - name: Save session for next run
        if: always() && hashFiles('state/state.bin') != ''
        uses: actions/cache/save@v4
        with:
          path: state/
          key: dbx-state-${{ github.run_id }}
      - name: Save debug screenshots if it failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug
          path: debug/
          retention-days: 3
          if-no-files-found: ignore

  # GitHub pauses schedules in repos with no activity for 60 days.
  keepalive:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/punch.yml/enable"
        env:
          GH_TOKEN: ${{ github.token }}
