name: Darwinbox punch

on:
  # The real punches are started by cron-job.org (exact times). This daily
  # schedule only keeps the workflow enabled (GitHub pauses idle repos).
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      action:
        description: "in or out"
        required: true
        default: "in"
        type: choice
        options: [in, out]
      dry_run:
        description: "Dry run (log in and check, never click)"
        type: boolean
        default: true

concurrency:
  group: darwinbox-punch
  cancel-in-progress: false

jobs:
  punch:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Restore saved session
        uses: actions/cache/restore@v4
        with:
          path: state/
          key: dbx-state-${{ github.run_id }}
          restore-keys: dbx-state-
      - name: Punch
        env:
          DARWINBOX_USER: "13431"
          DARWINBOX_PASS: ${{ secrets.DARWINBOX_PASS }}
          DARWINBOX_STATE: ${{ secrets.DARWINBOX_STATE }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
          # Dry runs ignore the day/time guards (they never click).
          FORCE: ${{ inputs.dry_run && '1' || '0' }}
        run: node punch.js "${{ inputs.action }}"
      - name: Save session for next run
        if: always() && hashFiles('state/state.bin') != ''
        uses: actions/cache/save@v4
        with:
          path: state/
          key: dbx-state-${{ github.run_id }}
      - name: Save debug screenshots if it failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug
          path: debug/
          retention-days: 3
          if-no-files-found: ignore

  # GitHub pauses schedules in repos with no activity for 60 days.
  keepalive:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/punch.yml/enable"
        env:
          GH_TOKEN: ${{ github.token }}
